[package]
name = "weave-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WeaveText Lua 5.4 plugin host (WeaveText Lua plugin format)"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde_json = "1"
yaml-rust2 = { version = "0.10", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

# 网络 / networking — rustls + webpki-roots，不依赖系统证书
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

# 密码学 / crypto
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
ecb = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std"] }
base64 = "0.22"
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
