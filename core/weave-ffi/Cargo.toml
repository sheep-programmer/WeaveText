[package]
name = "weave-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JNI bindings of the WeaveText engine for Android"

[lib]
name = "weave"
crate-type = ["cdylib", "rlib"]

[dependencies]
weave-engine = { path = "../weave-engine" }
weave-dict = { path = "../weave-dict" }
jni = "0.21"
weave-plugin = { path = "../weave-plugin" }
serde_json = "1"
# 运行时载入按需下载的语音识别库。 Loads the downloadable speech runtime at run time.
libloading = "0.8"
# 模型包解压（纯 Rust 的 bzip2 实现）。 Model archive extraction (pure-Rust bzip2).
tar = { version = "0.4", default-features = false }
bzip2 = "0.6"
