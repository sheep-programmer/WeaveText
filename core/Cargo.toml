[workspace]
resolver = "2"
members = ["weave-dict", "weave-engine", "weave-plugin", "weave-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
# 不在 cargo 里 strip：macOS 上会产出无法加载的 dylib；Android 打包时 AGP 会自动 strip。
# No cargo strip: it breaks dylibs on macOS; AGP strips Android libraries when packaging.
strip = false

[profile.dev.package."*"]
opt-level = 2
