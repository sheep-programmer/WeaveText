[package]
name = "weave-c"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI of the WeaveText engine for desktop front ends (macOS)"

[lib]
name = "weave_c"
crate-type = ["staticlib", "rlib"]

[dependencies]
weave-engine = { path = "../weave-engine" }
weave-dict = { path = "../weave-dict" }
weave-link = { path = "../weave-link" }
weave-plugin = { path = "../weave-plugin" }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
