name: Mac Release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  mac:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}

      - name: Check public release and version
        run: |
          gh release view "$TAG" --json isDraft --jq 'select(.isDraft == false)' | grep -q false
          version=$(sed -nE 's/^ *versionName = "(.*)"/\1/p' android/app/build.gradle.kts)
          test "v$version" = "$TAG"
          # Older tags may have kept the engine version behind the Android release.
          # Align only package metadata in this checkout, leaving the tagged source code intact.
          python3 - "$version" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path("core/Cargo.toml")
          text, count = re.subn(r'^version = "[^"]*"$', f'version = "{sys.argv[1]}"', path.read_text(), count=1, flags=re.M)
          assert count == 1
          path.write_text(text)
          PY
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Use the released dictionaries
        run: |
          # The successful Android release already built and verified the shared data.
          # Reuse its dictionaries instead of fetching the mutable upstream LTS asset again.
          gh release download "$TAG" --pattern "WeaveText-$VERSION-arm64.apk" \
            --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/weave-android"
          python3 - "$RUNNER_TEMP/weave-android" "$VERSION" <<'PY'
          from pathlib import Path
          import hashlib, struct, sys, zipfile
          root = Path(sys.argv[1])
          apk = root / f"WeaveText-{sys.argv[2]}-arm64.apk"
          sums = dict((line.split()[1], line.split()[0]) for line in (root / "SHA256SUMS.txt").read_text().splitlines())
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == sums[apk.name], "APK checksum mismatch"
          out = Path("data/build")
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(apk) as archive:
              for name in archive.namelist():
                  if name.startswith("assets/dict/") and name.endswith(".wvz"):
                      data = archive.read(name)
                      assert data[:4] == b"WVPK" and struct.unpack_from("<I", data, 4)[0] == 1, name
                      (out / Path(name).name).write_bytes(data)
          for key in ("pinyin", "wubi86", "english", "grammar", "emoji", "st_characters", "st_phrases", "follow"):
              assert (out / f"{key}.wvz").is_file(), key
          PY

      - name: Build and test universal Mac installer
        env:
          WEAVE_VERSION: ${{ env.VERSION }}
        run: macos/scripts/build-app.sh

      - name: Upload Mac assets
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if printf '%s\n' "$assets" | grep -Fxq "WeaveText-$VERSION-mac.pkg" &&
             printf '%s\n' "$assets" | grep -Fxq "WeaveText-$VERSION-mac.dmg" &&
             printf '%s\n' "$assets" | grep -Fxq SHA256SUMS-mac.txt; then
            echo "Mac assets already uploaded for $TAG"
            exit 0
          fi
          mkdir -p dist
          cp "macos/build/WeaveText-$VERSION.pkg" "dist/WeaveText-$VERSION-mac.pkg"
          cp "macos/build/WeaveText-$VERSION.dmg" "dist/WeaveText-$VERSION-mac.dmg"
          (cd dist && shasum -a 256 *-mac.pkg *-mac.dmg > SHA256SUMS-mac.txt)
          gh release upload "$TAG" dist/*
